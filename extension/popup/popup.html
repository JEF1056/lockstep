<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lockstep</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M10 8l6 4-6 4V8z"/>
        </svg>
        <span class="brand-title">Lockstep</span>
      </div>
      <div id="header-status-indicator" class="header-indicator hidden">
        <span class="status-dot"></span>
      </div>
    </header>

    <!-- State 1: Unpaired -->
    <main id="view-unpaired" class="view">
      <div class="hero-card">
        <p class="hero-desc">Sync any web video peer-to-peer. Zero servers, zero config.</p>
        <button id="btn-unpaired-pick" class="btn btn-primary" type="button">
          <svg class="btn-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          <span>Pick Video &amp; Copy Link</span>
        </button>
      </div>

      <details id="details-pair-key" class="pair-details">
        <summary class="details-summary">
          <span>Enter pair key</span>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </summary>
        <form id="form-connect" class="pair-form" novalidate>
          <label for="pair-key" class="field-label">Pair key</label>
          <div class="input-row">
            <input id="pair-key" class="text-input" type="text" placeholder="e.g. amber-owl-42" autocomplete="off" spellcheck="false" required>
            <button id="btn-connect" class="btn btn-secondary" type="submit">Connect</button>
          </div>
        </form>
      </details>
    </main>

    <!-- State 2: Paired Idle -->
    <main id="view-paired-idle" class="view hidden">
      <div class="status-panel">
        <div class="status-row">
          <span id="idle-status-dot" class="status-dot"></span>
          <span id="idle-status-text" class="status-text font-mono">Waiting for partner…</span>
        </div>
        <div class="key-badge">
          <span class="key-label">Key:</span>
          <span id="idle-key-value" class="key-value font-mono"></span>
        </div>
      </div>

      <div class="actions-stack">
        <button id="btn-paired-pick" class="btn btn-primary" type="button">
          <svg class="btn-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <span>Select Video</span>
        </button>

        <button id="btn-copy-invite" class="btn btn-secondary" type="button">
          <svg id="icon-copy" class="btn-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <svg id="icon-copied" class="btn-icon check-icon hidden" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span id="copy-btn-text">Copy Invite Link</span>
        </button>
      </div>

      <footer class="panel-footer">
        <button id="btn-unpair-idle" class="btn-quiet" type="button">Unpair</button>
      </footer>
    </main>

    <!-- State 3: Syncing -->
    <main id="view-syncing" class="view hidden">
      <div class="sync-panel">
        <div class="sync-header-row">
          <span class="sync-badge">SYNCING</span>
          <span id="sync-domain" class="sync-domain font-mono">unknown</span>
        </div>

        <div class="sync-status-row">
          <span id="sync-status-dot" class="status-dot dot-emerald"></span>
          <span id="sync-status-text" class="status-text font-mono">LIVE · 0ms</span>
        </div>
      </div>

      <div class="actions-stack">
        <button id="btn-end-session" class="btn btn-danger" type="button">
          <svg class="btn-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
          <span>End Session</span>
        </button>

        <button id="btn-resync" class="btn btn-secondary" type="button">
          <svg class="btn-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"/>
            <polyline points="23 20 23 14 17 14"/>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
          </svg>
          <span>Resync</span>
        </button>
      </div>

      <footer class="panel-footer">
        <button id="btn-unpair-sync" class="btn-quiet" type="button">Unpair</button>
      </footer>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
